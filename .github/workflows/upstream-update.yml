name: upstream release update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-release-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UPDATE_BRANCH: automation/upstream-release
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an upstream release
        id: update
        run: |
          scripts/update-release
          if git diff --quiet -- Formula; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(awk -F'"' '/^  version / { print $2; exit }' Formula/dol-chs.rb)"
          test -n "$version"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test generated update
        if: steps.update.outputs.changed == 'true'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          python3 -B -m unittest discover -s test -v
          brew style Formula/dol-chs.rb Formula/dol-chs-mod.rb
          brew audit --strict "$TAP_NAME/dol-chs" "$TAP_NAME/dol-chs-mod"
          brew readall --aliases --os=all --arch=all "$TAP_NAME"

      - name: Push the update branch
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add Formula/dol-chs.rb Formula/dol-chs-mod.rb
          git commit -m "dol: update to $VERSION"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Create or refresh the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.update.outputs.version }}
          PR_TITLE: "dol: update to ${{ steps.update.outputs.version }}"
          PR_BODY: |
            此 PR 由 `upstream release update` 工作流自动生成。

            - 上游版本：`${{ steps.update.outputs.version }}`
            - 同步两个 Formula 的下载地址、版本和 SHA-256
            - 已通过 Python 单元测试、Formula 样式与严格审计，以及全 OS/架构解析

            合并前仍可通过常规 `tests` 工作流完成各平台的实际安装与运行测试。
        run: |
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          fi
